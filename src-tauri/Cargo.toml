[package]
name = "amazon-music-floating-lyrics-bridge"
version = "0.1.0"
description = "Native companion bridge that detects the currently playing track (Windows SMTC first) and exposes it to the Lyrics for Amazon Music UI over localhost WebSocket + HTTP."
authors = ["lyrics-amazon"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
tokio = { version = "1.53.2", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Win32_System_Com", "Win32_Foundation"] }
