[package]
name = "amazon-music-floating-lyrics-bridge"
version = "0.5.7-rc.2"
description = "Native companion bridge that detects the currently playing track (Windows SMTC first) and exposes it to the Lyrics for Amazon Music UI over localhost WebSocket + HTTP."
authors = ["lyrics-amazon"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1.53.2", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
windows-collections = "0.3.2"

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
